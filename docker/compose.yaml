# A deployment that survives a reboot and can be upgraded without ceremony:
#
#     docker compose -f docker/compose.yaml up -d
#     docker compose -f docker/compose.yaml exec altero altero user add <name>
#     docker compose -f docker/compose.yaml exec altero altero login list
#
# Run those from the repository root. `-f` is what the file living in docker/
# costs; `export COMPOSE_FILE=docker/compose.yaml` buys it back for a shell.
#
# Point the Zotero client at http://<host>:8000/ and turn its streaming off --
# see "Using it from the Zotero desktop app" in README.md.
#
# Named explicitly: the project name otherwise follows the directory the file
# sits in, and renaming it to "docker" would leave an existing deployment's
# volumes behind under the old prefix with its library in them.
name: altero

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: altero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altero}
      POSTGRES_DB: altero
    # One mount at /var/lib/postgresql, not at .../data: 18 keeps its files in
    # a major-version subdirectory, and mounting the parent is what the image
    # asks for, so that a later pg_upgrade --link is not working across a mount
    # boundary. A volume written by 17 stops the container here with an error
    # naming the version that wrote it -- it is never adopted silently -- but
    # that also means moving from 17 is a dump and restore, not a pull.
    volumes:
      - db:/var/lib/postgresql
    # altero waits for this rather than crash-looping until the database is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altero"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  altero:
    # The context is the repository root: the image installs src/, migrations/
    # and the lock file, none of which are in this directory.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Migrations run on start, so this is also how an upgrade applies them.
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALTERO_DATABASE_URL: postgresql+asyncpg://altero:${POSTGRES_PASSWORD:-altero}@db:5432/altero
    volumes:
      - storage:/data
    # Bound to the loopback interface: put a TLS terminator in front rather
    # than exposing the API to the network directly.
    ports:
      - "127.0.0.1:${ALTERO_PUBLISH_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db:
  storage:
