# Build altero from this checkout instead of pulling the published image:
#
#     docker compose -f docker/compose.yaml -f docker/compose.build.yaml up -d --build
#
# which is what a change to the source, the Dockerfile or the web interface
# wants; `export COMPOSE_FILE=docker/compose.yaml:docker/compose.build.yaml`
# says it once per shell instead of once per command.
#
# The name matches compose.yaml so that both files address one deployment
# rather than two: a build reaches the volumes an earlier pull wrote.
name: altero

services:
  altero:
    # A local name, so that a built image never sits under the published one
    # where a later `docker compose pull` would replace it without warning.
    image: altero:local
    # The context is the repository root: the image installs src/, migrations/
    # and the lock file, none of which are in this directory.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Never reach for the registry for `altero:local`; there is nothing there.
    pull_policy: build
