[project]
name = "altero"
version = "0.1.0"
description = "A Python implementation of the Zotero data server supporting version 3 of the Zotero Web API"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Erich Seifert" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21",
    "uvicorn[standard]>=0.36",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    # Two fixes altero's output depends on, neither of which it can reach from
    # outside: 0.10.6 counts `citation-number` as a variable call in a
    # `cs:group`, which is what makes a numeric style's citation render at all
    # and was altero's own correction until then; 0.10.7 defaults the
    # delimiters around a style's `and`, without which every bibliography of
    # more than one author reads `Doe, J.& Roe, R.`
    "citeproc-py>=0.10.7",
    "citeproc-py-styles>=0.1.6",
    "dateparser>=1.4.1",
    "bibtexparser>=1.4.4",
    "rispy>=0.10.0",
    # The outbound conversations this server has: reading a library out of
    # api.zotero.org when somebody migrates one in (services/zoteroapi.py), and
    # talking to an OpenID Connect provider (services/oidc.py).
    "httpx>=0.28",
    # XML signature verification for the SAML service provider. Hand-rolling
    # this is not on: canonicalisation is where naive implementations grow
    # signature-wrapping holes, and XMLVerifier.verify returns the *signed*
    # subtree, which is the specific defence -- see services/saml.py. It brings
    # lxml and cryptography, both of which publish manylinux wheels for 3.14,
    # so docker/Dockerfile needs no build tooling.
    "signxml>=5.1.0",
]

[project.optional-dependencies]
# The driver a PostgreSQL deployment needs. An extra rather than a dependency,
# so a single-user SQLite install does not carry it, and rather than a dev-only
# package, so a built image can actually talk to PostgreSQL -- which is how the
# container came to crash-loop the first time it was pointed at one.
postgres = ["asyncpg>=0.31.0"]

[project.urls]
Homepage = "https://github.com/eseifert/altero"

[project.scripts]
altero = "altero.cli:main"

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "httpx>=0.28",
    "pre-commit>=4.6.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altero"]
# The built web interface is gitignored -- it is produced by `npm run build`,
# not committed -- and hatchling honours VCS ignore rules, so without this the
# wheel would quietly ship without the interface in it.
artifacts = ["src/altero/web/static/**"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
# `tools` holds what is run by hand rather than shipped: the wheel packages
# `src/altero` alone. It is still this project's code, and imports of it sort
# with the rest of it.
known-first-party = ["altero", "tools"]

[tool.ty.environment]
python-version = "3.14"
# The project root is a search path so that the `tests` package resolves the
# same way it does under pytest.
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["altero"]
branch = true
