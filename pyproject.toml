[project]
name = "altero"
version = "0.1.0"
description = "A Python implementation of the Zotero data server supporting version 3 of the Zotero Web API"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Erich Seifert" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21",
    "uvicorn[standard]>=0.36",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/eseifert/altero"

[project.scripts]
altero = "altero.cli:main"

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "httpx>=0.28",
    "pre-commit>=4.6.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altero"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["altero"]

[tool.ty.environment]
python-version = "3.14"
# The project root is a search path so that the `tests` package resolves the
# same way it does under pytest.
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["altero"]
branch = true
