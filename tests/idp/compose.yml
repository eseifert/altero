# Disposable test directory only; these credentials are public fixtures.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: [start-dev, --import-realm]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./altero-realm.json:/opt/keycloak/data/import/altero-realm.json:ro
    environment:
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/localhost/9000;
          printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3;
          read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
