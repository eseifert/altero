name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run already in progress for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv reads this and installs the interpreter itself, so the job does not
  # depend on which Python the runner image happens to ship.
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv publishes floating major tags only
      # up to v7, so `@v9` does not resolve even though v9.0.0 is current.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Matches web/.nvmrc. Vite 8 needs ^20.19 || >=22.12, so the runner's
          # default is not something to rely on.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` rather than `install`: it fails when the lock file and
      # package.json have drifted apart instead of quietly resolving something
      # nobody committed.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is what the Docker image runs, and it type-checks the
      # templates as well; a component that only fails to compile would
      # otherwise reach master with the unit tests green.
      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The concurrency tests need a real PostgreSQL: SQLite serializes writers
    # and so cannot exhibit the races they cover. Without this they skip, and a
    # lost-update bug would reach master unnoticed.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: altero
          POSTGRES_PASSWORD: altero
          POSTGRES_DB: altero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALTERO_TEST_POSTGRES_URL: postgresql+asyncpg://altero:altero@localhost:5432/altero

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv publishes floating major tags only
      # up to v7, so `@v9` does not resolve even though v9.0.0 is current.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        # Every test must run here: a skip means PostgreSQL was not reachable and
        # the concurrency coverage silently disappeared, which is exactly the
        # thing this job exists to catch.
        run: |
          set -o pipefail
          uv run pytest -q -rs --cov=altero --cov-report=term-missing | tee result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::Tests were skipped; every test must run in CI."
            grep -E "^SKIPPED" result.txt || true
            exit 1
          fi

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv publishes floating major tags only
      # up to v7, so `@v9` does not resolve even though v9.0.0 is current.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Apply to an empty database
        env:
          ALTERO_DATABASE_URL: sqlite+aiosqlite:///ci.sqlite
        run: uv run alembic upgrade head

      - name: Check the models match the migrations
        # Fails when a model was changed without a matching revision, which would
        # otherwise only surface as a broken deployment.
        env:
          ALTERO_DATABASE_URL: sqlite+aiosqlite:///ci.sqlite
        run: uv run alembic check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv publishes floating major tags only
      # up to v7, so `@v9` does not resolve even though v9.0.0 is current.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group docs

      # `--strict` fails the build on a link to a page that moved or an anchor
      # that was renamed. The deploy workflow would publish both without a
      # word, and a restructuring of docs/ leaves exactly those behind.
      - name: Build
        run: uv run zensical build --clean --strict
