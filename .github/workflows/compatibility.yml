name: Desktop compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

jobs:
  contracts:
    name: Replay pinned client contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Read the pinned revision
        id: pin
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path("tools/compatibility/contracts.toml").read_text())
          print("revision=" + manifest["zotero"]["revision"])
          reference = tomllib.loads(Path("tools/compatibility/reference.toml").read_text())
          print("reference=" + reference["dataserver"]["revision"])
          PY

      - uses: actions/checkout@v7
        id: source
        with:
          repository: zotero/zotero
          ref: ${{ steps.pin.outputs.revision }}
          path: .compatibility/zotero
          persist-credentials: false

      - uses: actions/checkout@v7
        id: reference
        with:
          repository: zotero/dataserver
          ref: ${{ steps.pin.outputs.reference }}
          path: .compatibility/dataserver
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: tools/compatibility/package-lock.json

      - name: Install the JavaScript parser
        id: harness
        working-directory: tools/compatibility
        run: npm ci

      - name: Verify the source and function selectors
        run: uv run python -m tools.compatibility verify --zotero-source .compatibility/zotero --dataserver-source .compatibility/dataserver

      - name: Replay contracts
        run: |
          uv run pytest -q -rs compatibility_tests --zotero-source .compatibility/zotero --junitxml=.compatibility/results.xml
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          if ET.parse(".compatibility/results.xml").findall(".//skipped"):
              raise SystemExit("Every desktop compatibility check must run; tests were skipped")
          PY

      - name: Prove known protocol defects are detected
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          uv run python -m tools.compatibility mutations \
            --zotero-source .compatibility/zotero \
            --state-dir .compatibility/mutations --output .compatibility/mutations.json

      - name: Discover source gaps
        if: always() && steps.source.outcome == 'success' && steps.reference.outcome == 'success' && steps.harness.outcome == 'success'
        run: |
          uv run python -m tools.compatibility analyze \
            --zotero-source .compatibility/zotero \
            --dataserver-source .compatibility/dataserver \
            --output .compatibility/report.json \
            --markdown .compatibility/report.md \
            --evidence .compatibility/evidence.json
          uv run python -m tools.compatibility coverage \
            --output .compatibility/coverage.json --markdown .compatibility/coverage.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-compatibility
          path: |
            .compatibility/*.json
            .compatibility/*.md
            .compatibility/results.xml
            .compatibility/mutations/*.xml
            .compatibility/mutations/*.log
          retention-days: 14
          if-no-files-found: ignore

  upstream:
    name: Inspect upstream changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - uses: actions/checkout@v7
        with:
          repository: zotero/zotero
          ref: main
          path: .compatibility/zotero
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: tools/compatibility/package-lock.json

      - name: Install the JavaScript parser
        working-directory: tools/compatibility
        run: npm ci

      # Upstream is discovery input, not a silently changed supported baseline.
      - name: Inspect the current upstream client
        run: |
          uv run python -m tools.compatibility analyze \
            --zotero-source .compatibility/zotero --allow-source-drift \
            --output .compatibility/upstream.json \
            --markdown .compatibility/upstream.md \
            --evidence .compatibility/upstream-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-compatibility-upstream
          path: |
            .compatibility/upstream*.json
            .compatibility/upstream.md
          retention-days: 14
          if-no-files-found: ignore

  desktop:
    name: Desktop transitions (${{ matrix.scenario }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, conflicts, filing, groups, files, relationships, recovery, credentials]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: altero
          POSTGRES_PASSWORD: altero
          POSTGRES_DB: altero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altero"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCEPTANCE_POSTGRES_URL: postgresql+asyncpg://altero:altero@localhost:5432/altero
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python and desktop runtime dependencies
        run: |
          uv sync --locked
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libxt6

      - name: Fetch the configured pinned Linux desktop
        id: desktop
        run: |
          uv run python - <<'PY' > .desktop-env
          import tomllib
          from pathlib import Path
          pin = tomllib.loads(Path("tools/compatibility/desktop.toml").read_text())["desktop"]
          for field in ("url", "sha256", "version"):
              print("DESKTOP_" + field.upper() + "=" + pin[field])
          PY
          cat .desktop-env >> "$GITHUB_ENV"
          set -a
          source .desktop-env
          set +a
          [[ "$DESKTOP_URL" == https://www.zotero.org/download/client/dl\?* ]]
          [[ "$DESKTOP_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p .compatibility
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .compatibility/desktop.tar.bz2 "$DESKTOP_URL"
          printf '%s  %s\n' "$DESKTOP_SHA256" .compatibility/desktop.tar.bz2 | sha256sum --check --strict
          tar -xjf .compatibility/desktop.tar.bz2 -C .compatibility

      - name: Run real data, file and schema convergence
        run: |
          uv run python -m tools.compatibility acceptance \
            --desktop-executable .compatibility/Zotero_linux-x86_64/zotero \
            --desktop-version "$DESKTOP_VERSION" --xvfb --schema-corpus \
            --scenario "${{ matrix.scenario }}" --postgres-url "$ACCEPTANCE_POSTGRES_URL" \
            --state-dir .compatibility/desktop-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.scenario }}
          path: |
            .compatibility/desktop-run/acceptance.json
            .compatibility/desktop-run/*/acceptance.json
            .compatibility/desktop-run/*/phase-*.json
            .compatibility/desktop-run/*/server/database.json
            .compatibility/desktop-run/xvfb.log
            .compatibility/desktop-run/*/A/desktop.log
            .compatibility/desktop-run/*/B/desktop.log
            .compatibility/desktop-run/*/A/data/zotero.sqlite
            .compatibility/desktop-run/*/B/data/zotero.sqlite
          retention-days: 14
          if-no-files-found: ignore
