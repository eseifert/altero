<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page run under a phone's notch and home
         indicator; the shell pads itself by the safe areas (App.vue). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Both, so the browser paints its own chrome to match before Vue runs. -->
    <meta name="color-scheme" content="light dark" />
    <!--
      The mark for a light tab, which is also the pre-script default: the theme
      store swaps this for the dark one as soon as it knows which theme is in
      force. A `media` query here would decide it by the operating system and
      ignore an explicit choice, and not every browser honours it anyway.
    -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon-light.svg" />
    <!--
      Installing it: the manifest for every browser that reads one, and what
      iOS reads instead -- a PNG touch icon, a title for the home screen, and
      leave to open it without Safari's bars. The colour of the browser's own
      chrome is the header bar's, set here for the first paint and kept in
      step with the theme by stores/theme.ts.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="altero" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f5f4" />
    <title>altero</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
